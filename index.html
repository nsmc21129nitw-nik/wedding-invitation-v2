<style>

html{scroll-snap-type:y proximity;scroll-behavior:smooth}

.hero::before{top:14px;bottom:14px;border-radius:220px 220px 14px 14px}
.hero::after{top:22px;bottom:22px;border-radius:212px 212px 8px 8px;opacity:.5}

.hint{position:absolute;bottom:42px;animation:bob 1.8s infinite;color:var(--soft)}

.om{font-size:3.2rem;color:var(--gold);line-height:1}

.nm{font-size:clamp(3.8rem,18vw,6rem);line-height:1.1;color:#8a4b2c;text-shadow:0 2px 0 #fff8}

.amp{font-size:2.6rem;color:var(--gold)}
.names .mantra{font-size:clamp(1.05rem,4.6vw,1.3rem);max-width:22rem;margin-top:6px}

.ev{color:#fff}
.arch{background:#fff7e3;color:#5b1c2a;border:3px solid var(--gold);border-radius:150px 150px 22px 22px;padding:54px 30px 36px;width:min(92%,340px);box-shadow:0 0 0 8px #ffffff22,0 18px 50px #0006}

.arch .big{font-size:4.4rem;font-weight:600;line-height:1;margin:6px 0}
.arch .mo{font-family:"Josefin Sans","Tiro Devanagari Hindi",sans-serif;letter-spacing:.3em;font-size:.85rem}

.pill{display:inline-block;margin-top:18px;padding:11px 22px;border:1.5px solid var(--gold);border-radius:99px;color:#5b1c2a;text-decoration:none;font-family:"Josefin Sans","Tiro Devanagari Hindi",sans-serif;font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;background:#fff9;transition:.3s;cursor:pointer}
.pill:hover{background:var(--gold);color:#fff}
.cd{background:#2a0f16;color:#f7dfae}
.cd h3{font-size:3rem;color:#f2c76a}
.cdr{display:flex;gap:12px;margin:26px 0 8px}
.cdr div{width:70px;padding:14px 0;border:1px solid #f2c76a66;border-radius:14px;background:#ffffff0a}
.cdr b{display:block;font:600 2rem "Cormorant Garamond","Tiro Devanagari Hindi",serif}
.cdr span{font:.6rem "Josefin Sans",sans-serif;letter-spacing:.2em;text-transform:uppercase;opacity:.8}

.end p{font-size:1.3rem;line-height:1.7;margin:8px 0;max-width:22rem}
.sign{font-size:3.4rem;margin-top:6px;color:#8a4b2c}
.wish{margin-top:18px;padding:15px 30px;border:0;border-radius:99px;background:linear-gradient(135deg,#d6405a,#a31d3d);color:#fff;font:600 1.1rem "Cormorant Garamond","Tiro Devanagari Hindi",serif;box-shadow:0 8px 24px #a31d3d66;cursor:pointer;transition:.3s}
.wish:hover:not(:disabled){transform:scale(1.05)}
.wish:disabled{background:linear-gradient(135deg,#6f8f5a,#46683a);box-shadow:none;cursor:default}
.live{margin-top:14px;font:.85rem "Josefin Sans","Tiro Devanagari Hindi",sans-serif;color:#7a1f2e;display:flex;align-items:center;gap:8px;justify-content:center}
.live i{width:9px;height:9px;border-radius:50%;background:#e02b2b;animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.25;transform:scale(1.5)}}

.dots{position:fixed;right:10px;top:50%;transform:translateY(-50%);z-index:9;display:flex;flex-direction:column;gap:10px}
.dots a{width:8px;height:8px;border-radius:50%;background:#b98a3eaa;border:1px solid #fff8}

.bar select,.bar button{height:34px;border-radius:99px;border:1px solid var(--gold);background:#fff9e8ee;color:#5b1c2a;font:600 .85rem "Josefin Sans","Tiro Devanagari Hindi",sans-serif;padding:0 12px;cursor:pointer}

@media (prefers-reduced-motion:reduce){.rv{transition:none;opacity:1;transform:none}.bells i,.hint,.live i{animation:none}html{scroll-behavior:auto}}

</head>
